<div class="container mt-3 mb-5" style="max-width: 450px;">
    <h3>Contact us!</h3>

    <div class="container p-2">
        <form action="">
            <label for="tapatio">Name:</label>
            <input type="text" id="tapatio" class="form-control form-control-sm">

            <label for="tapatio2" class="mt-2">Email:</label>
            <input type="text" id="tapatio2" class="form-control form-control-sm">

            <label for="subject" class="mt-2">Subject:</label>
            <input type="text" id="subject" class="form-control form-control-sm">

            <label for="subjects" class="mt-2">Choose Subject:</label>
            <select id="subjects" name="subjects" class="form-select form-select-sm">
                <option value="8">Choose A Subject</option>
                <option value="9">Math</option>
                <option value="10">Science</option>
                <option value="11">Social Studies</option>
                <option value="12">English</option>
            </select>

            <p class="mt-2 mb-1">Gender</p>
            <input type="radio" id="Male" name="gender" value="Male">
            <label for="Male">Male</label>
            <input type="radio" id="Female" name="gender" value="Female">
            <label for="Female">Female</label>

            <p class="mt-2 mb-1">What Are Your Skills?</p>
            <input type="checkbox" id="Coding" name="Skills" value="coding">
            <label for="Coding">Coding</label>
            <input type="checkbox" id="Design" name="Skills" value="Design">
            <label for="Design">Design</label>
            <input type="checkbox" id="Electronics" name="Skills" value="Electronics">
            <label for="Electronics">Electronics</label>
        </form>
